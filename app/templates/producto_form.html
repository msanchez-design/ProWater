{% extends "base.html" %}
{% block content %}
<h1>Nuevo producto</h1>

<form method="post" action="/productos/nuevo" class="card">
  <div class="field">
    <label>Nombre</label>
    <input type="text" name="nombre" required placeholder="Ej: Bidón con canilla 20L">
  </div>
  <div class="field">
    <label>Precio ($)</label>
    <input type="number" step="0.01" name="precio" value="0">
  </div>
  <div class="field">
    <label>Observación</label>
    <textarea name="observacion" rows="2"></textarea>
  </div>
  <button type="submit">Guardar</button>
  <a href="/productos" class="btn btn-secundario">Cancelar</a>
</form>
{% endblock %}
